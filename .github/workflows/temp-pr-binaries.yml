# Temporary: remove after Windows release builds are verified in this PR.
name: Temporary PR binary builds

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temp-pr-binaries-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BIN_NAME: twitter

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-aarch64
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: darwin-x86_64
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            archive_ext: zip
            vcpkg_triplet: x64-windows-static-md

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            name: windows-arm
            archive_ext: zip
            vcpkg_triplet: arm64-windows-static-md

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install native deps via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }
          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) {
            throw "vcpkg.exe not found at $vcpkgExe"
          }

          & $vcpkgExe install "sqlite3:${{ matrix.vcpkg_triplet }}" "curl:${{ matrix.vcpkg_triplet }}" "zlib:${{ matrix.vcpkg_triplet }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install sqlite3/curl/zlib with vcpkg."
          }

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=${{ matrix.vcpkg_triplet }}" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=0" >> $env:GITHUB_ENV
          # Static curl needs zlib and the Windows IP Helper library.
          $nativeLibDir = Join-Path $vcpkgRoot "installed/${{ matrix.vcpkg_triplet }}/lib"
          if (-not (Test-Path (Join-Path $nativeLibDir "zlib.lib"))) {
            throw "Static zlib library not found in $nativeLibDir"
          }
          "RUSTFLAGS=$env:RUSTFLAGS -L native=$nativeLibDir -l static=zlib -l iphlpapi" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BIN_NAME }}
          cd -

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ env.BIN_NAME }}.exe -DestinationPath ../../../${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          cd -

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-${{ matrix.target }}.${{ matrix.archive_ext }}
