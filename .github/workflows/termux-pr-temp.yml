# Temporary: remove after the Android builds succeed and binaries are tested.
name: Temporary Termux PR builds

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: termux-pr-temp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Termux (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: termux-pr-${{ matrix.target }}

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Build Android binary
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash .github/scripts/build-android.sh "${{ matrix.target }}"

      - name: Package binary
        run: |
          tar -czf "twitter-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" twitter
          sha256sum "twitter-${{ matrix.target }}.tar.gz" \
            > "twitter-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload test binary
        uses: actions/upload-artifact@v7
        with:
          name: twitter-${{ matrix.target }}-pr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            twitter-${{ matrix.target }}.tar.gz
            twitter-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
