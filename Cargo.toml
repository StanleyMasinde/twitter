[package]
name = "twitter"
version = "1.9.1"
edition = "2024"

[dependencies]
curl-rest = "0.5.4"
curl = "0.4.50"
serde =  { version = "1.0.229", features = ['derive']}
serde_json = "1.0.151"
oauth = { version = "0.6", package = "oauth1-request" }
dirs = "6.0.0"
toml = "1.1.4"
clap = { version = "4.6.6", features = ["derive"] }
infer = "0.22.0"
indicatif = "0.18.6"
sha2 = "0.11.0"
hex = "0.4.3"
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
parse_datetime = "0.16.0"
jiff = "0.2.35"
rusqlite = "0.40.2"
tabled = "0.21.0"
oauth2 = { version = "5.0.0", default-features = false, features = ['curl'] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serial_test = "4.0.1"

[[bench]]
name = "split_tweet"
harness = false

[profile.release]
opt-level = "z" 
lto = true  
codegen-units = 1
panic = "abort"
strip = true 
